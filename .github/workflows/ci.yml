name: CI

on:
  push:
    branches: [master, experimental]
  pull_request:
    branches: [master, experimental]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew chiseledBuild --stacktrace

      # PR refs look like "4/merge" and branches may contain "/", which artifact names reject.
      - name: Derive artifact name
        id: artifact
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: echo "name=${{ github.event.repository.name }}-${REF//\//-}-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/libs/**/*.jar
          if-no-files-found: error

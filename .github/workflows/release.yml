name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Inject version into stonecutter.properties.toml
        run: |
          sed -i 's/^mod.version = .*/mod.version = "${{ steps.version.outputs.version }}"/' stonecutter.properties.toml
          grep '^mod.version' stonecutter.properties.toml

      - name: Build all versions
        run: ./gradlew chiseledBuild --stacktrace

      - name: Collect distributable jars
        id: collect
        run: |
          mkdir -p dist
          for f in build/libs/${{ steps.version.outputs.version }}/head-vault-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) ;;
              *) cp "$f" dist/ ;;
            esac
          done
          ls -l dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — Minecraft 26.1.2 + 26.2
          body: "**Minecraft 26.1.2 & 26.2** · Fabric · server-side"
          append_body: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.jar

      - name: Publish 26.1.2 to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: YbXwRQXG
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/head-vault-*+26.1.2.jar
          name: HeadVault ${{ steps.version.outputs.version }} (Minecraft 26.1.2)
          version: ${{ steps.version.outputs.version }}+26.1.2
          loaders: fabric
          game-versions: '26.1.2'
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}

      - name: Publish 26.2 to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: YbXwRQXG
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: dist/head-vault-*+26.2.jar
          name: HeadVault ${{ steps.version.outputs.version }} (Minecraft 26.2)
          version: ${{ steps.version.outputs.version }}+26.2
          loaders: fabric
          game-versions: '26.2'
          version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}

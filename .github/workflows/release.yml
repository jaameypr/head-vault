name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Read Minecraft version
        id: mc
        run: echo "mc=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d '\r')" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --stacktrace -Pmod_version=${{ steps.version.outputs.version }}

      # Collect only the distributable jar (exclude -sources/-dev jars) for the release.
      - name: Collect release jar
        run: |
          mkdir -p dist
          for f in build/libs/head-vault-*.jar; do
            case "$f" in
              *-sources.jar|*-dev.jar) ;;
              *) cp "$f" dist/ ;;
            esac
          done
          ls -l dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — Minecraft ${{ steps.mc.outputs.mc }}
          body: "**Minecraft ${{ steps.mc.outputs.mc }}** · Fabric · server-side"
          append_body: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*.jar

      # ── Publishing to Modrinth / CurseForge (disabled: PUBLISH=none) ─────────────
      # To enable, set repo secrets MODRINTH_TOKEN and CURSEFORGE_TOKEN, fill in the
      # ids below, and uncomment this step. version-type is auto: 'beta' for a tag
      # containing '-' (e.g. v1.2.0-experimental.1), else 'release'.
      #
      # - name: Publish to Modrinth & CurseForge
      #   uses: Kir-Antipov/mc-publish@v3.3
      #   with:
      #     modrinth-id: <MODRINTH_ID>
      #     modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
      #     curseforge-id: <CURSEFORGE_ID>
      #     curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     files: dist/*.jar
      #     loaders: fabric
      #     game-versions: 26.1.2
      #     version-type: ${{ contains(github.ref_name, '-') && 'beta' || 'release' }}

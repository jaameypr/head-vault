# Increase memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# IntelliJ / Loom are not yet fully compatible with the configuration cache.
org.gradle.configuration-cache=false

# ─────────────────────────────────────────────────────────────────────────────
# UPDATE-SPEED CONTROL PANEL
# To port HeadVault to a new Minecraft version, in the common case you ONLY edit
# the five version lines below, then run `./gradlew build`. Any code that breaks
# is confined to the `compat` package (see ARCHITECTURE.md).
# Verify current values at https://fabricmc.net/develop
# ─────────────────────────────────────────────────────────────────────────────

# Fabric toolchain
minecraft_version=26.1.1
loader_version=0.19.3
fabric_api_version=0.145.4+26.1.1
loom_version=1.16-SNAPSHOT

# Bundled libraries (jar-in-jar)
sgui_version=2.0.0+26.1
permissions_version=0.7.0

# Mod identity
mod_version=0.1.0
maven_group=it.pruefert
archives_base_name=head-vault

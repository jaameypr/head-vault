plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom adds the Minecraft + Fabric mavens automatically; these are for our extra deps.
	maven {
		name = 'Nucleoid'
		url = 'https://maven.nucleoid.xyz/'
	}
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// NOTE: 26.1 is unobfuscated — there is intentionally NO `mappings` line.

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Bundled libraries (jar-in-jar via `include`, on the classpath via `implementation`).
	// sgui = server-side chest GUIs (vanilla-client compatible); fabric-permissions-api = LuckPerms-compatible checks.
	include "eu.pb4:sgui:${project.sgui_version}"
	implementation "eu.pb4:sgui:${project.sgui_version}"
	include "me.lucko:fabric-permissions-api:${project.permissions_version}"
	implementation "me.lucko:fabric-permissions-api:${project.permissions_version}"

	// Tests (pure JVM, no Minecraft runtime needed).
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
	useJUnitPlatform()
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	filesMatching('fabric.mod.json') {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
